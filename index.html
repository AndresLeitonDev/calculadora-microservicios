<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Microservicios</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #loading {
            display: none;
            text-align: center;
            margin-top: 10px;
        }

        #resultado {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>

    <script defer src="funcionalidad.js"></script>
</head>

<body>

<div class="container">

    <h2>🧮 Calculadora Microservicios</h2>

    <input type="number" id="num1" placeholder="Número 1">
    <input type="number" id="num2" placeholder="Número 2">

    <select id="tipo">
        <option value="path">PATH</option>
        <option value="query">QUERY</option>
        <option value="body">BODY</option>
    </select>

    <button onclick="calcular('suma')">➕ Sumar</button>
    <button onclick="calcular('resta')">➖ Restar</button>
    <button onclick="calcular('multiplicacion')">✖ Multiplicar</button>
    <button onclick="calcular('division')">➗ Dividir</button>
    <button onclick="limpiar()">🧹 Limpiar</button>

    <p id="loading">⏳ Procesando...</p>

    <h3 id="resultado">Resultado: --</h3>

</div>

</body>
</html>
