<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Microservicios</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 500px;
        width: 100%;
    }

    h2 {
        color: #667eea;
        text-align: center;
        margin-bottom: 30px;
    }

    .input-group {
        margin-bottom: 20px;
    }

    label {
        font-weight: 600;
        display: block;
        margin-bottom: 5px;
    }

    input, select {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 2px solid #ddd;
    }

    input:focus {
        border-color: #667eea;
        outline: none;
    }

    .button-group {
        display: grid;
        gap: 10px;
        margin-top: 20px;
    }

    button {
        padding: 15px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        transform: translateY(-2px);
    }

    button:disabled {
        background: gray;
        cursor: not-allowed;
    }

    #loading {
        display: none;
        margin-top: 10px;
        color: #667eea;
        font-weight: bold;
        text-align: center;
    }

    #resultado {
        margin-top: 20px;
        font-size: 1.3rem;
        font-weight: bold;
        text-align: center;
    }
</style>

<script defer src="funcionalidad.js"></script>


</head>

<body>


<div class="container">

    <h2>🧮 Calculadora de Microservicios</h2>

    <div class="input-group">
        <label>Número 1</label>
        <input type="number" id="num1">
    </div>

    <div class="input-group">
        <label>Número 2</label>
        <input type="number" id="num2">
    </div>

    <div class="input-group">
        <label>Tipo de envío</label>
        <select id="tipo">
            <option value="path">PATH</option>
            <option value="query">QUERY</option>
            <option value="body">BODY</option>
        </select>
    </div>

    <div class="button-group">
        <button onclick="calcular('suma')">➕ Sumar</button>
        <button onclick="calcular('resta')">➖ Restar</button>
        <button onclick="calcular('multiplicacion')">✖ Multiplicar</button>
        <button onclick="calcular('division')">➗ Dividir</button>
        <button onclick="limpiar()">🧹 Limpiar</button>
    </div>

    <p id="loading">⏳ Procesando...</p>

    <h3 id="resultado">Resultado: --</h3>

</div>


</body>

</html>
